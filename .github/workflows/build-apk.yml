name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        working-directory: android-app
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wallpaper -keypass wallpaper \
            -dname "CN=WallpaperExtend,O=Extend,C=CN"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build two release APKs
        working-directory: android-app
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assemblePersonRelease assembleLiteRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-extend-release
          path: android-app/app/build/outputs/apk/**/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wallpaper-extend-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v1.${{ github.run_number }}"
          tag_name: "v1.${{ github.run_number }}"
          files: "*.apk"
          generate_release_notes: true
          draft: false
          prerelease: false
